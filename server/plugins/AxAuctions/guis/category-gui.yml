# DOCUMENTATION: https://docs.artillex-studios.com/axauctions.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html
# SiftVanilla: the categories of categories.yml (the same as SiftCore's, plus redstone).

title: "Categories"
# a gui can have 1-6 rows
rows: 3
# valid values: CHEST, WORKBENCH, HOPPER, DISPENSER, BREWING
