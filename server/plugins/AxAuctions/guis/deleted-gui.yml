# DOCUMENTATION: https://docs.artillex-studios.com/axauctions.html
# ITEM BUILDER: https://docs.artillex-studios.com/item-builder.html

title: "Deleted items"
# a gui can have 1-6 rows
rows: 6
# how many items should be shown on a single page?
page-size: 45

# ----- ITEMS -----

previous-page:
  slot: 45
  material: "ARROW"
  conditions:
    - "%current_page% > 1"
  name: "&fPrevious page"
  lore:
    - "&7You're on page %current_page% of %max_page%"
  actions:
    - "[PAGE] previous"
    - "[SOUND] ui.button.click|0.25|1"

main:
  slot: 46
  material: "OAK_DOOR"
  name: "&fBack"
  lore:
    - "&7To the auction house"
  actions:
    - "[MENU] main"
    - "[SOUND] ui.button.click|0.25|1"

information:
  slot: 49
  material: "PAPER"
  name: "&fDeleted items"
  lore:
    - "&7Expired listings nobody took back"
    - "&7within 7 days end up here"
    - "&7Staff can return one if you ask"

next-page:
  slot: 53
  material: "ARROW"
  conditions:
    - "%current_page% < %max_page%"
  name: "&fNext page"
  lore:
    - "&7You're on page %current_page% of %max_page%"
  actions:
    - "[PAGE] next"
    - "[SOUND] ui.button.click|0.25|1"
