# Text of bounties (/bounty, /bounties, /bountyadmin).
# Tags, checked when the file loads: <primary> <secondary> <money> <error> <shards> <on> <off> <accent>, named and hex colours (<red>, <#3CC4EE>),
# <bold>, <shadow:#000000>, <icon:name>, <!italic>, <newline>, click and hover, plus each message's own placeholders
# (shown in angle brackets). Gradients, rainbow and obfuscated text are rejected: such an entry keeps the shipped text.
# Money is coloured automatically.

bounties:
  place:
    placed: "<primary>You put <amount> on <name>. Their bounty is now <total>."
    target: "<primary>Someone put <amount> on your head. Your bounty is now <total>."
    # The same as a title, for players whose Bounty on you alert setting shows titles.
    target-title: "<error>Bounty on you: <total>"
    reminder: "<primary>There is a <total> bounty on your head."
    announce: "<amount> <secondary>was put on <primary><name><secondary>. Their bounty is now <total><secondary>."
    minimum: "<primary>The smallest bounty is <amount>."
    yourself: "<primary>You can't put a bounty on yourself."
    cancelled: "<secondary>Bounty cancelled."
    confirm-title: "Confirm bounty"
    confirm-body:
      - "<primary>Put <amount> on <name>?"
      - "<secondary>You get it back if nobody kills them within <accent><time></accent>."
    # Only while bounties.yml claim.tax-percent is above 0.
    confirm-tax: "<secondary>The killer gets it minus <accent><tax>%</accent> tax."
    confirm-button: "Place bounty"
    confirm-tooltip: "<primary>Whoever kills them gets the money.<newline><secondary>You can't take it back before it runs out."
    form-title: "Place a bounty"
    form-player: "Player name"
    form-amount: "Amount, at least <minimum>"
    form-submit: "Place bounty"
    form-submit-tooltip: "<primary>The money waits until someone kills them.<newline><secondary>If nobody does within <accent><time></accent>, you get it back."
  claim:
    claimed: "<primary>You claimed <payout> for killing <name>. <secondary><tax> went to tax."
    claimed-no-tax: "<primary>You claimed <payout> for killing <name>."
    announce: "<primary><killer> <secondary>claimed the <total> <secondary>bounty on <primary><name><secondary>."
    sponsor: "<primary>Your bounty on <name> was claimed by <killer>."
    own: "<secondary>You can't claim the part of <name>'s bounty that you put up yourself."
    too-rich: "<primary>You can't hold that much money, so the bounty on <name> stays."
  refund:
    expired: "<primary>Nobody claimed your <amount> bounty on <name> in time. You got it back."
    removed: "<primary>Your <amount> bounty on <name> was removed by staff. You got it back."
  list:
    title: "Bounties"
    # Above a list that shows only the biggest ones (bounties.yml list-size).
    capped: "<secondary>The <accent><count></accent> biggest bounties"
    # Hovering a bounty's button ("Name: $5,000").
    tooltip: "<secondary>Number <accent><rank></accent>, put up by <primary><sponsors><newline><secondary>Kill them to claim it"
    line: "<secondary><rank>. <primary><name> <total> <secondary>from <sponsors>"
    empty: "<secondary>Nobody has a bounty right now."
    yours: "<secondary>The bounty on you is <total><secondary>."
    header: "<primary>Biggest bounties"
    place: "Place a bounty"
    place-tooltip: "<primary>Put money on a player's head.<newline><secondary>Whoever kills them gets it."
  details:
    title: "Bounty on <name>"
    total: "<primary><icon:bounty> <total>"
    sponsors: "<secondary>Put up by <primary><sponsors>"
    yours: "<secondary>Your part <amount>"
    expiry: "<secondary>The oldest part runs out in <accent><time>"
    claim-tooltip: "<primary>Add money to it.<newline><secondary>Whoever kills <name> gets all of it."
    # Only while bounties.yml claim.tax-percent is above 0.
    tax-tooltip: "<secondary><accent><tax>%</accent> of it goes to tax."
    none: "<primary><name> has no bounty."
    add: "Add to this bounty"
    place: "Put a bounty on them"
  sponsors:
    one: "1 player"
    many: "<count> players"
  admin:
    info-header: "<primary>Bounty on <name>: <total>"
    info-line: "<secondary>#<id> <amount> <secondary>from <primary><sponsor><secondary>, placed <ago> ago, runs out in <left>"
    none: "<primary><name> has no bounty."
    removed: "<primary>Removed the bounty on <name> and refunded <amount> to its sponsors <secondary>(<count> parts)."
    expired: "<primary>Refunded <count> expired bounty parts worth <amount>."
    nothing-expired: "<primary>No bounty has run out."
    failed: "<primary><count> refunds failed and stay active. <secondary>The server log has the reason."
    summary: "<primary><targets> players have a bounty, <total> in total. <secondary>Escrow <escrow>, stored rows: <rows>."
  # Labels and descriptions of the bounty settings (/settings).
  settings:
    bounty-target-alert: "Bounty on you alert"
    bounty-target-alert-description: "How you are told someone put money on your head. The sponsor stays anonymous."
    bounty-announcements: "Bounty announcements"
    bounty-announcements-description: "New and claimed bounties in chat: all, only from a minimum amount, or none."
    bounty-confirm-above: "Confirm bounties from"
    bounty-confirm-above-description: "Ask before placing a bounty of at least this amount. A bounty can't be taken back."
    bounty-join-reminder: "Bounty reminder on join"
    bounty-join-reminder-description: "When you join, remind you of the bounty on your head."
  hub:
    label: "Bounties"
    description: "Put money on a player's head"
