# Text of /sift (version, reload, self-test, metrics, debug) and the config problem alert for admins.
# Tags, checked when the file loads: <primary> <secondary> <money> <error>, named and hex colours (<red>, <#3CC4EE>),
# <bold>, <shadow:#000000>, <icon:name>, <!italic>, <newline>, click and hover, plus each message's own placeholders
# (shown in angle brackets). Gradients, rainbow and obfuscated text are rejected: such an entry keeps the shipped text.

admin:
  reload:
    done: "<primary>Reloaded <files> files in <time>."
    failed: "<primary>Nothing was reloaded. Fix these <count> problems first:"
  problem: "<secondary><file> <primary><path><secondary>: <message>"
  debug: "<primary>Debug logging is <state>."
  version: "<primary>SiftCore <version> <secondary>on <server>, <threading>"
  metrics:
    header: "<primary>SiftCore metrics <secondary>up <uptime>"
    line: "<secondary><name>: <primary><value>"
  selftest:
    start: "<primary>Running <count> checks..."
    pass: "<secondary>pass <primary><feature> <secondary><name> <time>"
    fail: "<primary>fail <feature> <name>: <detail>"
    done: "<primary><passed> passed, <failed> failed in <time>."
  # Told on join to admins with Config problem alerts on (/settings staff) when the last startup or /sift reload found
  # config problems. Hovering the line lists them; clicking it fills in /sift reload.
  config-alert:
    line: "<primary>Config problems at the last start or reload: <count>. <secondary>Hover to see them, fix them, then /sift reload."
    hover-more: "<secondary>and <count> more in the console log"
  settings:
    config-alerts: "Config problem alerts"
    config-alerts-description: "When you join, tell you if the last startup or /sift reload found config problems."
  "on": "on"
  "off": "off"
