# Text of homes (/sethome, /home, /delhome, /homes).
# Tags, checked when the file loads: <primary> <secondary> <money> <error> <shards> <on> <off> <accent>, named and hex colours (<red>, <#3CC4EE>),
# <bold>, <shadow:#000000>, <icon:name>, <!italic>, <newline>, click and hover, plus each message's own placeholders
# (shown in angle brackets). Gradients, rainbow and obfuscated text are rejected: such an entry keeps the shipped text.

homes:
  set: "<primary>Home <name> set. <secondary>You have <count> of <limit>."
  moved: "<primary>Home <name> moved here."
  limit: "<primary>You have <count> of <limit> homes. Delete one or move an existing one."
  invalid-name: "<primary>Home names are 1 to 16 letters, numbers, _ or -."
  world-disabled: "<primary>You can't set homes in this world."
  home-world-disabled: "<primary>Home <name> is in a world where homes are turned off."
  in-spawn: "<primary>You can't set a home at spawn."
  in-combat: "<primary>You can't set a home in combat. <time> left."
  loading: "<primary>Your homes are still loading. Try again in a moment."
  not-found: "<primary>You have no home called <name>."
  none: "<primary>You have no homes yet. Set one with /sethome."
  gone: "<primary>Home <name> no longer exists."
  world-missing: "<primary>The world of home <name> isn't available."
  teleported: "<primary>Welcome to <name>."
  deleted: "<primary>Home <name> deleted."
  unlimited: "unlimited"
  unsafe:
    title: "Unsafe home"
    body: "<primary>Home <accent><name></accent> doesn't look safe: <reason>."
    lava: "there is lava"
    fire: "there is fire"
    blocked: "a block fills the space"
    go: "<error>Teleport anyway"
  # The homes dialog: one status line, then a button per home (click to go there) with Delete next to it.
  list:
    title: "Homes"
    header: "<primary><icon:home> <accent><count></accent> of <accent><limit></accent> homes"
    # A home's button, and where it is in its tooltip (the second while Streamer mode hides coordinates).
    home: "<primary><name>"
    where: "<secondary><world> <accent><x>, <y>, <z>"
    where-hidden: "<secondary><world>"
    teleport-tooltip: "<primary>Click to teleport to <name>."
    delete: "<error>Delete"
    delete-tooltip: "<primary>Delete <name>. <secondary>Asks first."
    set-here: "Set a home here"
    set-here-tooltip: "<primary>Name a new home where you stand."
  delete:
    title: "Delete home"
    body:
      - "<primary>Delete home <accent><name></accent>?"
      - "<secondary><world> <x>, <y>, <z>"
    body-hidden:
      - "<primary>Delete home <accent><name></accent>?"
      - "<secondary><world>"
    button: "<error>Delete"
  # Asked before /sethome (or the form) moves a home that already exists, unless the player turned that off.
  overwrite:
    title: "Move home"
    body: "<primary>Move home <accent><name></accent> to where you stand?"
    from: "<secondary>Now: <world> <x>, <y>, <z>"
    to: "<secondary>New: <world> <x>, <y>, <z>"
    from-hidden: "<secondary>Now: <world>"
    to-hidden: "<secondary>New: <world>"
    button: "Move it here"
  # The settings in Settings, Teleports & homes: a label, and what it does (shown when hovering its button).
  settings:
    confirm-overwrite: "Confirm moving a home"
    confirm-overwrite-description: "Ask before /sethome moves a home you already have to where you stand."
    bare-command: "/home with no name"
    bare-command-description: "Go to your only home or open the list, go to the home named 'home', or always open the list."
    bare-smart: "Only home, or the list"
    bare-default-home: "The home named 'home'"
    bare-list: "Always the list"
  form:
    title: "Set a home"
    name: "Name"
    submit: "Set home"
    submit-tooltip: "<primary>Sets the home where you stand. <secondary>Names are 1 to 16 letters, numbers, _ or -."
  other:
    title: "Homes of <name>"
    header: "<primary><icon:home> <name> has <accent><count></accent> homes"
  admin:
    header: "<primary>Homes of <name> <secondary>(<count>)"
    line: "<primary><home> <secondary><world> <x>, <y>, <z>"
    empty: "<secondary><name> has no homes."
    deleted: "<primary>Deleted home <home> of <name>."
  hub:
    label: "Homes"
    description: "Teleport to your homes"
