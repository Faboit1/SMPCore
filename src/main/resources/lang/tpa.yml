# Text of teleport requests (/tpa, /tpahere, /tpaccept, /tpdeny, /tpacancel, /tpatoggle).
# Allowed tags: <primary> <secondary> <money> <error>, colours (<red>, <#3CC4EE>), <bold>, <shadow:#000000>, <icon:name> <!italic> <newline>, plus each message's placeholders.

tpa:
  sent: "<primary>Request sent to <name>. <secondary>It expires in <time>."
  sent-here: "<primary>Asked <name> to come to you. <secondary>It expires in <time>."
  sent-afk: "<primary>Request sent to <name>, who is AFK. <secondary>It expires in <time>."
  sent-here-afk: "<primary>Asked <name> to come to you, but they are AFK. <secondary>It expires in <time>."
  friend-sender: "<primary><name> lets friends come without asking. <secondary>Teleporting to them."
  friend-target: "<primary><name> is teleporting to you. <secondary>Friends can come without asking; /tpatoggle friends turns that off."
  incoming: "<primary><name> wants to teleport to you. <answer>"
  incoming-here: "<primary><name> wants you to teleport to them. <answer>"
  answer-link: "<secondary>Click to answer"
  answer-hover: "<secondary>Accept or deny. You can also type /tpaccept <name> or /tpdeny <name>."
  accepted: "<primary>Accepted <name>'s request."
  accepted-by: "<primary><name> accepted your request."
  denied: "<secondary>Denied <name>'s request."
  denied-by: "<primary><name> denied your request."
  cancelled: "<secondary>Request to <name> cancelled."
  cancelled-all: "<secondary>Cancelled <count> requests."
  cancelled-by: "<secondary><name> cancelled their teleport request."
  expired: "<secondary>Your request to <name> expired."
  no-requests: "<primary>You have no teleport requests."
  no-request-from: "<primary><name> hasn't sent you a request, or it expired."
  no-outgoing: "<primary>You have no requests waiting."
  no-outgoing-to: "<primary>You have no request waiting for <name>."
  target-disabled: "<primary><name> isn't taking teleport requests."
  # A /tpahere the target doesn't take from the sender (their "Pull requests from" setting).
  target-disabled-here: "<primary><name> isn't taking requests to come to you. <secondary>Ask with /tpa instead."
  blocked: "<primary>You can't send <name> a teleport request."
  in-combat: "<primary>You can't use teleport requests in combat. <time> left."
  other-in-combat: "<primary><name> is in combat. <secondary>Their request waits; accept it once the fight is over."
  other-fighting: "<primary><name> is in combat now. <secondary>The teleport was cancelled."
  instant: "<secondary>Teleporting to <name>."
  other-left: "<primary><name> isn't online anymore."
  not-moved: "<secondary><name> didn't teleport."
  toggled-on: "<primary>Players can send you teleport requests again."
  toggled-off: "<primary>Teleport requests to you are now declined."
  friends-on: "<primary>Friends can now teleport to you without asking."
  friends-off: "<primary>Friends have to ask before teleporting to you again."
  # /tpatoggle friends <choice>: <value> is the choice's name, like "Favourite friends".
  friends-set: "<primary>Accepting /tpa without asking from: <value>."
  friends-unknown: "<primary>Use one of these: <values>."
  no-friends: "<primary>There is no friends list on this server."
  # /tpatoggle when the server decides the setting. <setting> is the setting's name.
  setting-fixed: "<primary><setting> is set by the server."
  setting-refused: "<primary><setting> couldn't be changed."
  dialog:
    title: "Teleport request"
    body: "<primary><name> wants to teleport to you."
    body-here: "<primary><name> wants you to teleport to them."
    expires: "<secondary>Requests expire after <time>."
    moves-you: "<secondary>Accepting teleports you to <name>."
    accept: "Accept"
    deny: "Deny"
    choice-title: "Teleport requests"
    choice-accept: "<secondary>Pick the request to accept."
    choice-deny: "<secondary>Pick the request to deny."
    choice-tooltip: "<secondary>Wants to teleport to you"
    choice-tooltip-here: "<secondary>Wants you to teleport to them"
    deny-all: "Deny all"
  form:
    title: "Teleport request"
    body: "<secondary>Ask a player who is online. They get a message to accept or deny."
    waiting: "<primary>Requests waiting for you: <count>. <secondary>Answer with /tpaccept or /tpdeny."
    player: "Player name"
    direction: "Who moves"
    to-them: "I go to them"
    here: "They come to me"
    submit: "Send request"
  # The settings in Settings, Teleports & homes: a label, then one line that says what it does ("Everyone", "Friends"
  # and the other option names are the shared names in settings.yml).
  settings:
    requests: "Teleport requests from"
    requests-description: "Who can send you /tpa and /tpahere requests. Staff with the bypass always can."
    here: "Pull requests from"
    here-description: "Who can ask you to come to them with /tpahere. Applies on top of Teleport requests from."
    popup: "Requests open a pop-up"
    popup-description: "Open the accept/deny window when a teleport request arrives. Never in combat, while AFK or over another window."
    confirm-here: "Confirm before being pulled"
    confirm-here-description: "When /tpaccept would move you to someone (a /tpahere), ask once more."
  hub:
    label: "Teleport to a player"
    description: "Ask a player to teleport"
