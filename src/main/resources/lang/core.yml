# Shared text. Allowed tags: <primary> <secondary> <money> <icon:name> <!italic> <newline>, plus each message's
# own placeholders (shown in angle brackets). Money and numbers are coloured automatically.
# Bold, gradients, other colours and decorations are not part of the design and are rejected on load.

core:
  players-only: "<primary>Only players can do that."
  no-permission: "<primary>You can't do that."
  player-not-found: "<primary>Nobody called <name> has played here."
  player-not-online: "<primary><name> is not online."
  not-yourself: "<primary>You can't do that to yourself."
  cooldown: "<primary>Wait <time> before doing that again."
  invalid-amount: "<primary><secondary><input></secondary> is not an amount. Try 1500, 1.5k or 2m."
  amount-not-whole: "<primary><secondary><input></secondary> is not a whole amount."
  amount-not-positive: "<primary>The amount has to be more than zero."
  amount-too-large: "<primary>The most you can use is <max>."
  invalid-number: "<primary><secondary><input></secondary> must be a number from <min> to <max>."
  not-enough-money: "<primary>You need <amount> for that."
  not-enough-shards: "<primary>You need <amount> shards for that."
  balance-limit: "<primary>That would go over the balance limit."
  economy-unavailable: "<primary>Trading is paused for a moment. Try again soon."
  action-failed: "<primary>Something went wrong. Nothing was changed."
  slow-down: "<primary>Slow down a little."
  inventory-full: "<primary>Your inventory is full."
  disabled-here: "<primary>You can't do that here."
  loading: "<secondary>Loading..."

ui:
  back: "Back"
  close: "Close"
  confirm: "Confirm"
  cancel: "Cancel"
  submit: "Submit"
  ok: "Okay"
  "yes": "Yes"
  "no": "No"
  next-page: "<primary>Next page"
  next-page-lore: "<secondary>Go to page <page> of <pages>"
  previous-page: "<primary>Previous page"
  previous-page-lore: "<secondary>Go to page <page> of <pages>"
  sort: "<primary>Sort"
  filter: "<primary>Filter"
  option: "<secondary>• <option>"
  option-selected: "<primary>• <option>"
  cycle-hint: "<secondary>Left click for next, right click for previous"
  search: "<primary>Search"
  search-lore: "<secondary>Click to search by name"
  search-active-lore:
    - "<secondary>Showing results for <primary><query>"
    - "<secondary>Left click to change, right click to clear"
  search-title: "Search"
  search-input: "Name contains"
  search-clear: "Clear search"
  empty: "<primary>Nothing here"
  empty-lore: "<secondary>There is nothing to show yet"
  error-line: "<primary><error>"
  invalid-input: "<primary>Check <field> and try again."
  expired: "<primary>That menu expired. Open it again."

teleport:
  warmup: "<primary>Teleporting in <time>. Don't move."
  cancelled-move: "<primary>Teleport cancelled because you moved."
  cancelled-damage: "<primary>Teleport cancelled because you took damage."
  cancelled-replaced: "<secondary>Your previous teleport was cancelled."
  in-combat: "<primary>You can't teleport in combat. <time> left."
  done: "<primary>Teleported."
  failed: "<primary>That teleport didn't work. Try again."
