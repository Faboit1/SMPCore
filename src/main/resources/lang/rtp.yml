# Text of random teleport (/rtp).
# Allowed tags: <primary> <secondary> <money> <error>, colours (<red>, <#3CC4EE>), <bold>, <shadow:#000000>, <icon:name> <!italic> <newline>, plus each message's placeholders.

rtp:
  searching: "<secondary>Looking for a safe spot..."
  already-searching: "<primary>Still looking for a spot. Hold on."
  no-spot: "<primary>No safe spot found this time. Nothing was charged. Try again."
  landed: "<primary>Welcome to <region> at <x>, <z>."
  landed-paid: "<primary>Welcome to <region> at <x>, <z>. <secondary>Paid <amount>."
  # The same lines while the player hides coordinates (Settings > Privacy > Streamer mode).
  landed-hidden: "<primary>Welcome to <region>."
  landed-paid-hidden: "<primary>Welcome to <region>. <secondary>Paid <amount>."
  refunded: "<primary>The teleport didn't happen. You got your <amount> back."
  cancelled: "<primary>The random teleport was cancelled."
  unknown: "<primary>There is no random teleport called <name>."
  disabled: "<primary>Random teleport to <region> is turned off."
  no-permission: "<primary>You can't random teleport to <region>."
  unavailable: "<primary>Random teleport to <region> isn't available right now."
  cooldown: "<primary>You can random teleport to <region> again in <time>."
  none: "<primary>There is nowhere to random teleport to right now."
  sent: "<primary>Sent <name> to <region> at <x>, <z>."
  sent-failed: "<primary>Couldn't send <name> to <region>. No safe spot was found."
  menu:
    title: "Random teleport"
    intro: "<secondary>Pick where to go. You land on a random safe spot."
    line-free: "<primary><region> <secondary><min> to <max> blocks out, free."
    line-cost: "<primary><region> <secondary><min> to <max> blocks out, <amount>."
    ready: "<secondary>Ready."
    wait: "<secondary>Ready in <primary><time><secondary>."
    tooltip-free: "<secondary><min> to <max> blocks out. Free."
    tooltip-cost: "<secondary><min> to <max> blocks out. Costs <amount>."
  # Asked before a /rtp <region> that costs money, unless the player turned that off (the picker shows the price).
  confirm:
    title: "Confirm random teleport"
    body: "<primary>A random teleport to <region> costs <amount>."
    note: "<secondary>You pay only once a safe spot is found."
    button: "Teleport"
  # The settings in Settings, Teleports & homes: a label, then one line that says what it does.
  settings:
    confirm-cost: "Confirm paid random teleports"
    confirm-cost-description: "Show the price and ask first when a /rtp you type costs money. The region picker already shows prices."
    default: "/rtp with no region"
    default-description: "Open the region picker, or go straight to the region you used last."
    default-menu: "Open the picker"
    default-last: "Last region"
  hub:
    label: "Random teleport"
    description: "Go somewhere new"
