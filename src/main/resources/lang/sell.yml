# Text of /sell, /sell hand, /sell hand all, /sell all, /sell mastery, /sell top, /sell history, /worth and the
# price list.
# Tags, checked when the file loads: <primary> <secondary> <money> <error> <shards> <on> <off> <accent>, named and hex colours (<red>, <#3CC4EE>),
# <bold>, <shadow:#000000>, <icon:name>, <!italic>, <newline>, click and hover, plus each message's own placeholders
# (shown in angle brackets). Gradients, rainbow and obfuscated text are rejected: such an entry keeps the shipped text.
# Money amounts are coloured automatically.

sell:
  # The receipt in chat. <items> is "64 diamond" for one kind, "150 items" for several; hovering it lists them.
  # <booster> is the booster-note below while a server sell booster raised the price, and nothing otherwise.
  sold: "<primary>You sold <items> for <total><booster>."
  sold-bonus: "<primary>You sold <items> for <total> <secondary>with your <multiplier>x bonus<booster>."
  sold-bonuses: "<primary>You sold <items> for <total> <secondary>with your bonuses<booster>."
  sold-orders: "<primary>You sold <items> for <total>, <orders> of it from buy orders<booster>."
  # Shown on the action bar after a sale when feedback.action-bar is on, or when sale receipts are turned off.
  sold-action-bar: "<money>+<total><booster>"
  # Added to the receipts while a server sell booster (/booster) raised what the server paid.
  booster-note: "<secondary> incl. +<percent>% booster"
  orders-changed: "<secondary>Buy orders changed, so everything went to the server."
  items:
    one: "<amount> <item>"
    many: "<amount> items"
  # Lines of the receipt's hover card.
  receipt:
    line: "<secondary><amount> <item> <primary><value>"
    more: "<secondary>and <count> more kinds"
    bonus: "<secondary>Rank bonus <primary><multiplier>x"
    category-bonus: "<secondary><category> <primary><multiplier>x"
    order: "<secondary><amount> <item> to <owner>'s order <primary><value>"
    tax: "<secondary>Order tax <tax>"
    rest: "<secondary>Rest to the server <primary><value>"
    boxes: "<secondary><count> of them came out of shulker boxes"
    booster: "<secondary>Sell booster <primary>+<percent>%"
  level-up: "<primary><category> mastery is now level <level>. <secondary><category> items sell for <multiplier>x."
  # The same as a title, for players who picked Title for their sell mastery level-ups.
  level-up-title: "<primary><category> mastery <level>"
  # One sale levelled up several categories: one line above the hotbar (or a title), and each level-up in chat.
  level-up-many: "<primary><count> sell masteries levelled up. <secondary>See chat."
  level-up-many-title: "<primary><count> masteries up"
  empty-hand: "<primary>Hold the item you want to sell."
  not-sellable: "<primary>You can't sell <item>."
  modified: "<primary>Renamed, enchanted or damaged items can't be sold."
  traded: "<primary>Items from villager trades can't be sold."
  hold-plain: "<primary>Hold a plain <item> to sell all of them."
  box-nothing: "<primary>Nothing in that shulker box can be sold."
  bundle-nothing: "<primary>Nothing in that bundle can be sold."
  nothing-to-sell: "<primary>You have nothing that can be sold."
  nothing-of-type: "<primary>You have no plain <item> to sell."
  nothing-in-category: "<primary>You have nothing from <category> to sell."
  nothing-in-menu: "<primary>Nothing in the menu can be sold."
  in-combat: "<primary>You can't sell in combat. <time> left."
  loading: "<primary>Your sales are still loading. Try again in a moment."
  cancelled: "<secondary>Sale cancelled."
  failed: "<primary>The sale didn't go through. Your items are back."
  balance-full: "<primary>You can't hold that much money. Your items are back."
  too-much: "<primary>That's too much to sell at once. Sell less at a time."
  claim-box: "<primary><count> items didn't fit in your inventory. <secondary>They're waiting in your claim box (/claims)."
  # The confirmation before selling everything (sell-all.confirm in features/sell.yml).
  confirm:
    title: "Sell everything"
    title-type: "Sell all <item>"
    title-category: "Sell <category> items"
    body: "<primary>Sell <count> items for <total>?"
    bonus: "<secondary>Includes your <multiplier>x bonus"
    bonuses: "<secondary>Includes your rank and mastery bonuses"
    booster: "<secondary>Includes the +<percent>% sell booster"
    orders: "<secondary><orders> of it comes from <count> buy orders"
    inner: "<secondary><count> of them are in shulker boxes"
    kept: "<secondary>Kept: <count> items that can't be sold or don't stack"
    sell: "Sell for <total>"
    choose: "Choose items"
    changed: "<primary>Your inventory changed. Check the total, then sell."
  menu:
    title: "Sell items"
    total: "<primary>Total <total>"
    total-count: "<secondary><count> items can be sold"
    total-line: "<secondary><amount> <item> <primary><value>"
    total-more: "<secondary>and <count> more kinds"
    total-bonus: "<secondary>Includes your <primary><multiplier>x <secondary>bonus"
    total-bonuses: "<secondary>Includes your rank and mastery bonuses"
    total-booster: "<secondary>Includes the <primary>+<percent>% <secondary>sell booster"
    total-orders: "<secondary><orders> from <count> buy orders"
    total-unsellable: "<secondary><count> can't be sold and go back to you"
    total-mastery: "<secondary>Mastery: +<value> toward <category> level <level>"
    total-empty: "<secondary>Put items above to see what they sell for"
    total-hint: "<secondary>Closing the menu gives everything back"
    sell: "<primary>Sell"
    sell-lore: "<secondary>Sell everything above for <total>"
    sell-empty: "<secondary>Nothing here can be sold yet"
    total-lower: "<primary>The total is now <total>. Press Sell again."
    add: "<primary>Add sellable items"
    add-lore: "<secondary>Moves what can be sold from your inventory"
    add-none: "<primary>Nothing in your inventory can be sold."
    restored: "<primary>The items you left in the sell menu when the server stopped are back in your inventory."
    add-full: "<secondary>The menu is full."
    give-back: "<primary>Give back"
    give-back-lore: "<secondary>Puts everything above back in your inventory"
    mastery: "<primary>Mastery"
    mastery-lore: "<secondary>See your sell mastery levels"
  # /sell mastery
  mastery:
    title: "Sell mastery"
    line: "<primary><name> <secondary>level <level> of <max>, <multiplier>x, <sold> of <next> to level <next-level>"
    line-max: "<primary><name> <secondary>max level, <multiplier>x, <sold> sold"
    disabled: "<primary>Sell mastery is turned off on this server."
    detail-title: "<name> mastery"
    detail-rate: "<secondary><name> items sell for <primary><multiplier>x <secondary>(rank <rank>x, mastery +<bonus>)"
    ladder-done: "<secondary>Level <level> <threshold> done"
    ladder-next: "<primary>Level <level> <threshold> <secondary><left> to go"
    ladder-later: "<secondary>Level <level> <threshold>"
    sell: "Sell your <name> items (<count> for <total>)"
    prices: "Prices"
  # /sell top
  top:
    title: "Top sellers"
    line: "<primary><place>. <name> <sold>"
    empty: "<secondary>Nobody has sold anything yet."
    you: "<secondary>You: #<rank> <sold>"
    you-none: "<secondary>You haven't sold anything yet."
    you-hidden: "<secondary>You are hidden from leaderboards, so you have no place here."
  # /sell history
  history:
    title: "Your sales"
    entry: "<primary>Sold for <total>"
    ago: "<secondary><time> ago"
    orders: "<secondary><orders> of it from buy orders"
    items: "<secondary><items>"
    more: "<secondary>and more"
  # The price list (/worth with an empty hand, /worth list)
  browser:
    title: "Prices"
    price: "<secondary>Sells for <price> each"
    bonus: "<secondary>With your bonus <price><booster>"
    boosted: "<secondary>With the +<percent>% booster <price>"
    category: "<secondary>Category <primary><category>"
    shop: "<secondary>The shop sells it for <price>"
    order: "<secondary>Best buy order <price> each"
    carry: "<secondary>You carry <count>, worth <total>"
    source-base: "<secondary>From base price"
    source-derived: "<secondary>From recipe <recipe>"
    source-override: "<secondary>From override"
    hint: "<secondary>Click for details"
    sort-name: "Name"
    sort-highest: "Highest price"
    sort-lowest: "Lowest price"
    filter-all: "All"
  # The details of one item (click it in the price list)
  details:
    price: "<secondary>Sells for <price> each"
    bonus: "<secondary>With your <multiplier>x bonus <price><booster>"
    boosted: "<secondary>With the +<percent>% booster <price>"
    mastery: "<secondary><category> mastery level <level> of <max>"
    shop: "<secondary>The shop sells it for <price>"
    order: "<secondary>Best buy order <price> each"
    carry: "<secondary>You carry <count>"
    not-sold: "<secondary>The server doesn't buy this."
    sell: "Sell your <count> for <total>"
    buy: "Buy in the shop for <price>"
    order-it: "Order it"
  worth:
    each: "<primary>One <item> sells for <price>."
    stack: "<primary>One <item> sells for <price>, your <amount> for <total>."
    bonus: "<secondary>With your <primary><multiplier>x <secondary>bonus you get <total><booster>."
    boosted: "<secondary>With the <primary>+<percent>% <secondary>sell booster you get <total>."
    shop: "<secondary>The shop sells it for <price>."
    order: "<secondary>A buy order pays <price> each."
    box: "<primary>What's inside sells for <total> (<count> items)."
    box-empty: "<secondary>An empty box sells for <price>."
    box-nothing: "<primary>Nothing in that shulker box can be sold."
    none: "<primary>You can't sell <item>."
    below-one: "<primary>You can't sell <item>, it's worth too little."
    modified: "<primary>Renamed, enchanted or damaged items can't be sold. <secondary>A plain one sells for <price>."
    traded: "<primary>Items from villager trades can't be sold. <secondary>A plain <item> sells for <price>."
    hold: "<primary>Hold an item or name one, like /worth diamond."
    # Hovering an item name in /worth.
    click: "<secondary>Click to see it in the price list"
    # Shown to staff with siftcore.worth.details.
    source-base: "<secondary>Base price from features/sell.yml."
    source-derived: "<secondary>Worked out from the recipe <recipe>."
    source-override: "<secondary>Set by an override in features/sell.yml."
  # /sell admin mastery
  admin:
    header: "<primary><player>'s sell mastery"
    line: "<secondary><category> level <primary><level><secondary>, <sold> sold"
    none: "<primary><player> hasn't sold anything yet."
    reset: "<primary>Reset <player>'s <category> mastery."
    reset-all: "<primary>Reset all of <player>'s sell mastery."
    set: "<primary>Set <player>'s <category> mastery to level <level>."
    unknown-category: "<primary>There's no sell category called <name>."
    level-range: "<primary>Pick a level from 0 to <max>."
    loading: "<primary>That player's mastery is still loading. Try again in a moment."
  # Settings (/settings, the Money & selling group). Option names like "Server default" are shared (lang/settings.yml).
  settings:
    confirm: "Confirm /sell all from"
    confirm-description: "Ask before selling everything when the total is at least this much. The server's own always/never rule still wins."
    hotbar: "Hotbar on /sell all"
    hotbar-description: "Keep your hotbar items when selling everything, or sell them too. Server follows the server's setting."
    hotbar-keep: "Keep it"
    hotbar-sell: "Sell it too"
    orders: "Sell to buy orders first"
    orders-description: "Send items to buy orders that pay more than the server."
    shulkers: "/sell all opens shulker boxes"
    shulkers-description: "Also sell what is inside shulker boxes you carry."
    menu-close: "Closing the sell menu"
    menu-close-description: "Give your items back, or sell them when you close /sell. Quitting always gives them back."
    menu-close-return: "Give them back"
    menu-close-sell: "Sell them"
    level-up: "Sell mastery level-ups"
    level-up-description: "How your sell mastery level-ups are announced to you."
  hub:
    label: "Sell"
    description: "Sell items for money"
    prices-label: "Prices"
    prices-description: "See what items sell for"
