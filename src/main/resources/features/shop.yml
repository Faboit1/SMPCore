# The server shop (/shop). Players pick a category, then an item, then how many to buy.
#
# Safety: every item's price must be more than what it sells back for (its worth in data/worth-generated.yml) times
# the best sell multiplier in features/sell.yml times 1.1, and more than anything a recipe can turn it into sells
# for. A price that breaks this is a config problem: /sift reload refuses the change, and at startup that item is
# left out of the shop. So buying something and selling it back (or crafting it into something and selling that)
# never makes money.
# Items that can't be sold at all may have any price.

# Purchases that cost at least this much ask for confirmation first. 0 never asks.
confirm-above: 50k

# The most of one item a single purchase can buy, unless a category or item says otherwise (1 to 6400).
default-max: 640

menu:
  # Rows of the category screen (2 to 6). Your balance is shown in the middle of the bottom row.
  rows: 4

# Categories in the order they are listed. For each:
#   name:        what the category is called (plain text, up to 32 characters)
#   description: one short line under the name (optional, up to 64 characters)
#   icon:        the item shown for it
#   slot:        where it sits on the category screen (0 is the top left; not the balance slot)
#   default-max: the most of one item per purchase in this category (optional)
#   items:       what it sells. The key is an item id (stone) or any id you like with item: set (wool: {item: white_wool}).
#                price is per item; max (optional) is the most per purchase.
#                Spawners use spawner: <mob> instead of item:, and are only shown while spawner items are available.
