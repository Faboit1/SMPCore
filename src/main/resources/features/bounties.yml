# Bounties: players put money on another player's head; whoever kills that player claims it.
# The money waits in the bounty escrow until it is claimed or refunded. Amounts accept 1500, 1.5k, 2m and so on.
# Only kills that count claim a bounty (see anti-farm in combat.yml): no claims within a team, between players on
# the same IP address, or for the same killer and victim again too soon. Nobody can claim money they put up.

place:
  # The smallest amount one /bounty can add.
  minimum: 1k
  # Bounties of at least this much ask for confirmation first. 0 never asks.
  confirm-above: 100k
  # Time between two bounties placed by the same player.
  cooldown: 5s
  # Tell everyone in chat when a bounty is placed, if it is at least announce-above. 0 announces every bounty.
  announce: true
  announce-above: 50k
  # Tell the player that someone put money on their head.
  notify-target: true
  # Remind players with a bounty on their head when they join: "There is a $5,000 bounty on your head."
  remind-on-join: true

claim:
  # Part of a claimed bounty that is destroyed as tax, in percent (0 to 90). The killer gets the rest.
  tax-percent: 10
  # Tell everyone in chat when a bounty is claimed.
  announce: true
  # Tell the sponsors who are online that their bounty was claimed.
  notify-sponsors: true

expiry:
  # Each contribution goes back to its sponsor this long after it was placed if nobody claimed it.
  after: 14d
  # How often to look for contributions that ran out.
  check-every: 5m

# How many bounties /bounties shows (1 to 20).
list-size: 10
