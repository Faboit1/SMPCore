# Shards: the second currency. Players earn them in the AFK zone (features/afk.yml) and spend them in the shard
# shop (/shardshop). Changes apply with /sift reload.
#
# Shards never turn into money, and nothing here sells for money. Shards are created out of thin air just for being
# online; if they could be exchanged for money, every AFK hour would print money and push prices up for everyone who
# plays. Keeping them in their own shop means AFK time buys perks, never a share of the money economy.
#
# The key prices follow the crates' worth (docs/features/crates.md): a key's average return in shards and keys stays
# far below its price, so buying keys never makes shards, and an hour in the AFK zone (60 shards) buys about a
# Common key's worth.

shop:
  # Ask once more before a purchase that costs at least this many shards (0 = always ask).
  confirm-above: 500
  # Players in combat can't open the shop or buy (no totems or golden apples in the middle of a fight). Checked again
  # when they press Buy, so a shop opened before the fight sells nothing during it.
  block-in-combat: true
  # What the shop sells. Each offer:
  #   type:        key (crate keys, given by the crates feature) or item
  #   crate:       for keys: the crate id; keys: how many keys one purchase unit gives (1 to 64)
  #   item:        for items: an item id like totem_of_undying; amount: how many one unit gives (1 to 64)
  #   price:       shards for one unit
  #   max:         most units per purchase (1 to 64)
  #   name:        what it is called (plain text; empty means the item's own name, or "<crate> key" in the crate's
  #                colour for keys)
  #   description: one line telling what it is, shown when pointing at it (plain text, optional)
  #   order:       where it is listed: lower first (offers with the same order keep their file order). Optional.
  #   permission:  only players with this permission see and buy it (optional), e.g. siftcore.shards.event
  # Key offers only show while the crates feature knows that crate. Items that don't fit in the inventory go to the
  # claim box. An offer with a mistake is left out and reported when the config loads.
  offers:
    basic-key:
      type: key
      crate: basic
      keys: 1
      price: 50
      max: 16
      name: ""
      description: "Opens the Common crate in /crates"
      order: 1
    rare-key:
      type: key
      crate: rare
      keys: 1
      price: 200
      max: 16
      name: ""
      description: "Opens the Rare crate in /crates"
      order: 3
    epic-key:
      type: key
      crate: epic
      keys: 1
      price: 600
      max: 8
      name: ""
      description: "Opens the Epic crate in /crates"
      order: 4
    legendary-key:
      type: key
      crate: legendary
      keys: 1
      price: 1500
      max: 4
      name: ""
      description: "Opens the Legendary crate in /crates"
      order: 5
    experience:
      type: item
      item: experience_bottle
      amount: 32
      price: 40
      max: 16
      name: ""
      description: "32 bottles o' enchanting"
      order: 10
    golden-apples:
      type: item
      item: golden_apple
      amount: 8
      price: 120
      max: 8
      name: ""
      description: "8 golden apples"
      order: 11
    totem:
      type: item
      item: totem_of_undying
      amount: 1
      price: 250
      max: 4
      name: ""
      description: "Cheats death once"
      order: 12
    shulker-box:
      type: item
      item: shulker_box
      amount: 1
      price: 300
      max: 4
      name: ""
      description: "An empty shulker box"
      order: 13
    uncommon-key:
      type: key
      crate: uncommon
      keys: 1
      price: 110
      max: 16
      name: ""
      description: "Opens the Uncommon crate in /crates"
      order: 2
    mythic-key:
      type: key
      crate: mythic
      keys: 1
      price: 4000
      max: 2
      name: ""
      description: "Opens the Mythic crate in /crates"
      order: 6
    celestial-key:
      type: key
      crate: celestial
      keys: 1
      price: 11000
      max: 1
      name: ""
      description: "Opens the Celestial crate in /crates"
      order: 7
