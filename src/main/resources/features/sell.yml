# Selling to the server (/sell, /sell hand, /sell all, /worth) and the worth table every feature uses.
#
# The worth table is generated when the server starts and on /sift reload:
#   1. base-prices give raw and natural materials a price (logs, ores, crops, mob drops, natural blocks).
#   2. Everything the server's recipes make from priced items gets a price too: the cheapest recipe's ingredients,
#      divided by how many it makes, times craft-loss, rounded down to whole dollars. Items in a recipe loop
#      (ingot -> block -> ingot, re-dyeing a shulker box) are priced from the loop member that already has a price,
#      so going round a loop never changes what anything is worth.
#   3. overrides set the final price of single items (0 makes an item unsellable).
# The result is written to data/worth-generated.yml (with where each price came from) for reading.
#
# Only plain items sell: renamed, enchanted (enchanted books too), damaged, dyed, filled or otherwise changed items
# can't be sold, because their value depends on what was done to them.

# Every recipe step keeps this share of the ingredients' value (0.5 to 1). Below 1, crafting never turns items
# into more money than selling the ingredients.
craft-loss: 0.9

# Which recipe families prices are derived from: crafting, smelting, blasting, smoking, campfire, stonecutting,
# smithing. Crafting ingredients that leave something behind (a milk bucket leaves its bucket) are never counted.
recipe-types: [crafting, smelting, blasting, smoking, campfire, stonecutting, smithing]

# Rank sell bonuses. A player with siftcore.sell.multiplier.<tier> gets that multiplier; with several, the highest
# wins; with none, 1. Only permissions given explicitly (for example to a LuckPerms group) count, so operators
# don't get a bonus by default. The shop checks its prices against the highest multiplier listed here.
multipliers:
  supporter: 1.1
  patron: 1.2
  elite: 1.35
  legend: 1.5

sell-all:
  # /sell all leaves items that don't stack (tools, weapons, armor, shulker boxes) where they are.
  # /sell hand and the /sell menu still sell them.
  skip-unstackable: true
  # /sell all leaves the hotbar alone.
  skip-hotbar: false

# Price of one plain item, in whole dollars (1500, 1.5k and 2m all work). Keys are item ids (diamond or
# minecraft:diamond) or item tags (#minecraft:logs prices every log and wood). An item listed by id wins over a tag.
# Base prices are never replaced by recipes: if a natural block can also be crafted from something expensive
# (magma blocks from magma cream), give it a base price here so mining it doesn't pay like crafting it.
base-prices:
  # Wood and plants
  "#minecraft:logs": 6
  bamboo: 2
  cactus: 6
  sugar_cane: 6
  kelp: 2
  sea_pickle: 1
  lily_pad: 1
  brown_mushroom: 2
  red_mushroom: 2

  # Crops and food from farms
  wheat: 6
  carrot: 4
  potato: 4
  beetroot: 4
  melon_slice: 2
  pumpkin: 12
  apple: 4
  cocoa_beans: 3
  sweet_berries: 2
  glow_berries: 2
  nether_wart: 3
  chorus_fruit: 2
  honeycomb: 6
  honey_bottle: 10
  # Made from four honey bottles, which leave their glass behind, so no recipe can price it.
  honey_block: 36

  # Ores and minerals. Smelting raw metal into ingots adds value on purpose.
  coal: 8
  raw_copper: 2
  copper_ingot: 3
  raw_iron: 20
  iron_ingot: 25
  raw_gold: 30
  gold_ingot: 35
  redstone: 6
  lapis_lazuli: 10
  quartz: 12
