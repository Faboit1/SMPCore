  diamond_ore: 400
  deepslate_diamond_ore: 400
  emerald_ore: 250
  deepslate_emerald_ore: 250
  nether_quartz_ore: 12
  nether_gold_ore: 10

  # Natural blocks
  dirt: 1
  coarse_dirt: 1
  rooted_dirt: 1
  podzol: 1
  grass_block: 1
  mycelium: 1
  mud: 1
  moss_block: 1
