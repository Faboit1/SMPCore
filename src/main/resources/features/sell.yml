  chorus_fruit: 2
  honeycomb: 6
  honey_bottle: 10
  # Made from four honey bottles, which leave their glass behind, so no recipe can price it.
  honey_block: 36

  # Ores and minerals. Smelting raw metal into ingots adds value on purpose.
  coal: 8
  raw_copper: 2
  copper_ingot: 3
