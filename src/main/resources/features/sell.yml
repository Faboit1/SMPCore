  # Emeralds from villager trades are marked and don't sell (mark-villager-trades); mined ones do.
  emerald: 250
  ancient_debris: 1800
  netherite_scrap: 2000
  # Ores mined with silk touch sell for at most what one drop does, so placing one and mining it with fortune
  # always pays more than selling the ore.
  coal_ore: 8
  deepslate_coal_ore: 8
  iron_ore: 20
  deepslate_iron_ore: 20
  copper_ore: 4
  deepslate_copper_ore: 4
  gold_ore: 30
  deepslate_gold_ore: 30
  redstone_ore: 24
