  # Arrows are 4 for flint, a stick and a feather: priced flint keeps crafting arrows from paying more than the
  # ingredients.
  flint: 4
  sandstone: 2
  red_sandstone: 2
  clay_ball: 2
  snowball: 1
  ice: 2
  packed_ice: 3
  blue_ice: 6
  obsidian: 10
