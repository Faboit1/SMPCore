# Crates, virtual keys and the keyall (/crates, /keys, /keyall).
#
# Players open crates with keys. Keys are virtual (no key items): they come from the keyall below, the shard shop
# and staff (/keys give, events). Keys are never sold (docs/monetization.md); /sift store keys is a staff and event
# tool. Opening a crate spends one key and pays one reward, drawn by weight. The key,
# the reward and the crate log row are stored together in one transaction, so a crash or a full balance can never
# spend a key without paying or pay without a key. Won items go into the inventory, or into the claim box when they
# don't fit.
#
# There are seven crates, from Common to Celestial, each worth about three times the one below (see crates: at the
# end, and docs/features/crates.md for the numbers).
#
# Changes apply with /sift reload. A mistake is reported precisely and the reload is refused; at startup a broken
# reward is left out of its crate and a broken keyall is switched off.

# Shortest time between two crate openings with /crates open or a crate block (bypass permission:
# siftcore.bypass.cooldown). The crates dialog and the preview menu wait for each opening to finish instead.
open-cooldown: 1s

# Players in combat can't open crates (no totems or golden apples in the middle of a fight). They can still look
# at the crates and their rewards. The combat feature sets how long a combat tag lasts.
block-in-combat: true

# The most keys one click opens in a row ("Open 10" in the crate screens, /crates open <crate> <amount>). Each key
# is still opened, stored and paid out on its own, one after another; the player gets one summary. 0 or 1 turns it
# off (one key at a time). At most 64. Each player picks how many of these they open at once in /settings (Crates
# & kits, Keys per bulk open).
bulk-open: 10

# Sneaking and right-clicking a crate block opens a key straight away, without the crate screen or the opening
# animation. Each player picks in /settings whether it opens one key, several, or the crate screen after all.
quick-open: true

# Players who have unopened keys get a short reminder in chat a few seconds after joining (each player can turn it
# off in /settings).
join-reminder: true

grants:
  # A key grant with a reference (store purchases, shard shop, every player's keyall keys) is applied once: the
  # same reference again is refused. References are remembered this long (1d to 3650d).
  remember: 90d

# How the crates look and sound.
effects:
  # A floating name above every crate block: the crate's name in its colour, and how to use it.
  holograms: true
  # How far above the top of the block the name floats, in blocks (0 to 3).
  hologram-height: 0.5
  # Particles circling every crate block, in the crate's colour, while a player is within particle-range blocks
  # (0 turns them off, at most 64).
  particle-range: 16
  # The opening animation. Opening one key from a crate screen or the preview shows a chest window where a row of
  # rewards rolls past with a tick per step and slows down on the reward that was won, then shows it in its rarity's
  # colour with a fanfare; opened from a crate block, the reward also spins up out of the block. What is won is
  # decided and stored before the animation starts: clicking the window or closing it skips to the end, and leaving,
  # dying or teleporting never changes or loses the reward (what has not reached the inventory waits in the claim
  # box). Sneak + right-click on a crate block, /crates open and opening several keys at once never animate.
  animation:
    enabled: true
    # How long the row rolls (1s to 10s).
    length: 4s
    # How long the window shows the reward before it closes (0s to 10s).
    reveal: 2s
    # The sounds, each with a sound id, volume (0 to 2) and pitch (0.5 to 2). Each player's sound settings apply:
    # tick follows their click sounds, reveal and big-reveal their success sounds.
    sounds:
      # Every step of the roll (its pitch rises as the roll slows down).
      tick:
        sound: block.note_block.hat
        volume: 0.6
        pitch: 1.0
      # The reward shows.
      reveal:
        sound: entity.player.levelup
        volume: 0.7
        pitch: 1.2
      # The reward is of a rarity that is announced (legendary and up in the shipped file).
      big-reveal:
        sound: ui.toast.challenge_complete
        volume: 0.6
        pitch: 1.0

# Rarity tiers, in order from most common to rarest. Every reward names one (the first one is the default).
#   label:    the plain text shown in the preview and in the result (no tags or colour codes).
#   color:    the rarity's colour, as a hex colour like "#FFB12E": the reward's name in the preview, the result, the
#             receipt and announcements, and the glass of the opening animation when it shows the reward.
#   audit:    wins of this rarity are also written to the audit log (every win is always in the crate log).
#   announce: wins of this rarity are announced in chat to everyone (never for vanished staff). Each player picks
#             in /settings whether they see every announced win, only the rarest rarity's, or none.
rarities:
  common:
    label: "Common"
    color: "#C8C8C8"
    audit: false
    announce: false
  uncommon:
    label: "Uncommon"
    color: "#5BE36B"
    audit: false
    announce: false
  rare:
    label: "Rare"
    color: "#4DA6FF"
    audit: false
    announce: false
  epic:
    label: "Epic"
    color: "#C65BFF"
    audit: true
    announce: false
  legendary:
    label: "Legendary"
    color: "#FFB12E"
    audit: true
    announce: true
  mythic:
    label: "Mythic"
    color: "#FF4D6A"
    audit: true
    announce: true
  celestial:
    label: "Celestial"
    color: "#6FF3FF"
    audit: true
    announce: true

# The keyall: every interval, everyone online gets keys of one crate.
keyall:
  enabled: true
  # Time between two keyalls (5m to 7d). The next time is stored, so restarts keep the schedule.
  interval: 4h
  # The crate whose keys it gives, and how many each player gets (1 to 64).
  crate: uncommon
  amount: 1
  # When the server was offline at keyall time, the keyall runs this long after the next startup (0s to 1h), so
  # players have time to come back.
  missed-delay: 10m
  # Whether vanished staff get keys too.
  include-vanished: false
  # Whether players who are AFK get keys too (as on most SMPs, staying online is what earns them). Set it to false
  # to give keys only to players who are active; the AFK feature decides who is AFK.
  include-afk: true
  countdown:
    # Announcements in chat this long before the keyall (each at least 10s and shorter than the interval).
    chat: [5m, 1m]
    # The last seconds are counted down in everyone's action bar (0s turns it off, at most 1m).
    action-bar: 10s

# The crates. The key (basic, rare, ...) is the crate's id: 1 to 32 lowercase letters, digits, - or _. It is stored
# with every player's keys, so renaming it loses those keys; change name instead (the basic crate is called Common).
#
#   name:    plain short name. Text says "Common crate" and "Common key".
#   tier:    the crate's place in the ladder (1 is the lowest). Crates are listed by tier, and a crate's colour,
#            hologram and opening animation follow it. Crates with the same tier keep their file order.
#   color:   the crate's colour, as a hex colour like "#4DA6FF": its name in every screen, its hologram, the glass of
#            its opening animation and its particles.
#   icon:    the item shown for the crate in /crates.
#   blocks:  optional blocks that act as this crate, as "world x y z". Staff can also add blocks in-game with
#            /crates block add <crate> while looking at a block (stored in the database, not here).
#            Right-click shows the crate, sneak + right-click opens a key, left-click shows the rewards.
#   rewards: the rewards, keyed by an id (1 to 32 lowercase letters, digits, - or _; stored in the crate log).
#
# Every reward has:
#   weight:  how likely it is compared to the other rewards of the crate (the chance is weight / sum of weights;
#            the preview shows it as a percentage). Decimals are fine. The shipped weights of each crate add up to
#            100, so each weight is its chance in percent.
#   rarity:  a rarity id from above; the reward is shown in that rarity's colour.
#   display: optional plain text naming the reward in messages ("You won 8 diamonds from the Common crate.").
#            Without it, it is made from the reward ("8 diamond", "$5,000", "50 shards", "2 Rare keys").
#   icon:    optional item shown in the preview instead of the reward's own item.
# and exactly one of:
#   item: <item id>        items. amount (default 1, at most 640), optional name and lore (plain text, at most 8
#                          lines; the name is shown in the reward's rarity colour), enchants (enchantment: level;
#                          levels above the normal maximum need unsafe-enchants: true). Enchanted books get the
#                          enchantments stored in the book.
#   money: <amount>        money (1500, 1.5k, 2m). Paid with the ledger kind crate_reward.
#   shards: <amount>       shards. Paid with the ledger kind crate_reward.
#   keys: <crate id>       keys of a crate (amount, default 1, at most 64).
#   spawner: <mob id>      spawner items made by the spawners feature (amount, default 1). While that feature can't
#                          make this mob's spawner the reward is left out and the other chances grow to fill in.
#   commands: [...]        console commands run when the reward is won (%player% is the winner's name, %uuid% the
#                          UUID). Needs display and icon. Commands run after the win is stored; a failing command is
#                          logged so staff can give the reward by hand. Example:
#                            vip_week:
#                              commands: ["lp user %player% parent addtemp prospector 7d"]
#                              display: "a week of Patron"
#                              icon: name_tag
#                              weight: 1
#                              rarity: legendary
#
# What a key is worth on average: /crates info <crate> (money, shards, the sell value of the items and the keys of
# other crates). docs/features/crates.md has the numbers of the shipped crates next to how keys are earned, so the
# crates never print money: keep each tier worth about three times the one below, and keep the money part a third of
# a key's worth or less. Every crate has a small chance of a key of the next tier, so the lower crates lead upward.
