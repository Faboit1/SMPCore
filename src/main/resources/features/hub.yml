# The main menu (/menu, /hub).

# Buttons per row in the main menu.
columns: 2

pause-menu:
  # Adds a SiftVanilla button to the pause screen (and the quick actions key) that opens the menu.
  # Changes to this section and to lang/hub.yml pause-menu text apply after a restart.
  enabled: true
  # The buttons shown in the pause-screen menu, by hub entry id. Entries of disabled features open the main menu.
  entries:
    - menu
    - money
    - shop
    - sell
    - auction
    - orders
    - spawners
    - teams
    - homes
    - rtp
    - spawn
    - stats
    - settings
    - report

# Links shown in the pause screen's "Server links" and the menu's Links button.
# label: what the button says. url: https or http address.
server-links:
  rules:
    label: "Rules"
    url: "https://siftvanilla.net/rules"
  discord:
    label: "Discord"
    url: "https://discord.gg/siftvanilla"
  store:
    label: "Store"
    url: "https://store.siftvanilla.net"
