# Links shown in the pause screen's "Server links" and the menu's Links button.
# label: what the button says. url: https or http address.
server-links:
  rules:
    label: "Rules"
    url: "https://siftvanilla.com/rules"
  discord:
    label: "Discord"
    url: "https://discord.gg/siftvanilla"
  store:
    label: "Store"
    url: "https://store.siftvanilla.com"
