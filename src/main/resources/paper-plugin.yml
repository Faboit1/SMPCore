name: SiftCore
version: '${project.version}'
main: net.siftvanilla.siftcore.SiftCorePlugin
bootstrapper: net.siftvanilla.siftcore.SiftCoreBootstrap
api-version: '26.2'
folia-supported: true
description: The gameplay core of SiftVanilla.
authors: [SiftVanilla]
website: https://github.com/faboit1/smpcore
dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true
# Every other node is declared by the feature that checks it, at startup (see docs/permissions.md). These three
# belong to settings that several features share; they are listed here so permission plugins know them before
# SiftCore starts. Give them to groups with LuckPerms.
permissions:
  siftcore.admin.settings:
    description: See and change other players' settings with /sift settings
    default: op
  siftcore.stats.hide:
    description: Offer the 'Hide me from leaderboards' setting (staff and test accounts)
    default: false
  siftcore.settings.hide-rank:
    description: Offer the 'Show my rank' setting (rank groups)
    default: false
