# Icons are vanilla atlas sprites shown inline in text (scoreboard lines, dialog bodies, hover cards).
# No resource pack is needed. Lang files use them as <icon:name>, always followed by a space.
#
# atlas:  the atlas the sprite lives in. Item textures are in minecraft:items, block textures in minecraft:blocks,
#         HUD and menu sprites in minecraft:gui. Using the wrong atlas shows a magenta square, so every entry is
#         checked against the real 26.2 client assets when the plugin starts; a bad entry is reported and skipped.
# sprite: the sprite path inside that atlas, e.g. item/gold_ingot or hud/heart/full.
# tint:   keep    = show the sprite in its own colours.
#         inherit = take the colour of the surrounding text (good for white/grey sprites).
icons:
  money:
    atlas: minecraft:items
    sprite: item/gold_ingot
  shard:
    atlas: minecraft:items
    sprite: item/amethyst_shard
  kill:
    atlas: minecraft:items
    sprite: item/iron_sword
  death:
    atlas: minecraft:particles
    sprite: damage
  streak:
    atlas: minecraft:particles
    sprite: flame
  kdr:
    atlas: minecraft:particles
    sprite: critical_hit
    tint: inherit
  playtime:
    atlas: minecraft:items
    sprite: item/clock_00
  mobs:
    atlas: minecraft:items
    sprite: item/bone
  blocks:
    atlas: minecraft:items
    sprite: item/iron_pickaxe
  ping:
